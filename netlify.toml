# Netlify Configuration File for RentEase India Platform

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single Page Application (SPA) Redirect Rule for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Caching Headers
[[headers]]
  for = "/*"
    [headers.values]
      X-Frame-Options = "DENY"
      X-Content-Type-Options = "nosniff"
      Referrer-Policy = "strict-origin-when-cross-origin"
      Permissions-Policy = "geolocation=(), microphone=(), camera=()"
